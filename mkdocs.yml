site_name: Cours d'assembleur et de reverse engineering
site_description: Cours progressif d'assembleur x86-64 et de reverse engineering, des bases aux CTF et à l'analyse de malware
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  language: fr
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/progression.js
  - javascripts/themes.js
extra_css:
  - stylesheets/themes.css
  - stylesheets/extra.css

nav:
  - Accueil: README.md
  - Progression: progression.md
  - Installation sur Mac: environnement/INSTALLATION-MAC.md
  - Glossaire: glossaire.md
  - "Partie 0 : les bases du C":
      - "0.1 Compiler et afficher": partie0-c/01-compiler-afficher.md
      - "0.2 Variables et types": partie0-c/02-variables-types.md
      - "0.3 Conditions": partie0-c/03-conditions.md
      - "0.4 Boucles": partie0-c/04-boucles.md
      - "0.5 Fonctions": partie0-c/05-fonctions.md
      - "0.6 Pointeurs": partie0-c/06-pointeurs.md
      - "0.7 Chaînes de caractères": partie0-c/07-chaines.md
      - "0.8 Tableaux": partie0-c/08-tableaux.md
      - "0.9 Arguments du programme": partie0-c/09-arguments.md
      - "0.10 Structures": partie0-c/10-structures.md
      - "0.11 Allocation dynamique": partie0-c/11-allocation.md
      - "0.12 En-têtes et Makefile": partie0-c/12-makefile.md
      - "0.13 Projet de fin de partie": partie0-c/13-projet.md
  - "Partie 1 : l'assembleur":
      - "1. Les bases": partie1-assembleur/01-bases.md
      - "2. Registres et instructions": partie1-assembleur/02-registres-instructions.md
      - "3. Comparaisons et sauts": partie1-assembleur/03-comparaisons-sauts.md
      - "4. Les boucles": partie1-assembleur/04-boucles.md
      - "5. La pile et les fonctions": partie1-assembleur/05-pile-fonctions.md
      - "6. Mémoire et données": partie1-assembleur/06-memoire-donnees.md
      - "7. Du C à l'assembleur": partie1-assembleur/07-patterns-compilateur.md
  - "Partie 2 : le reverse":
      - "8. Méthode et outils": partie2-reverse/08-methode-outils.md
      - "9. Ghidra": partie2-reverse/09-ghidra.md
      - "10. GDB": partie2-reverse/10-gdb.md
      - "11. Classiques des crackmes": partie2-reverse/11-classiques-crackmes.md
      - "12. Protections": partie2-reverse/12-protections.md
      - "13. Analyse de malware": partie2-reverse/13-malware-analysis.md
      - "14. Et après ?": partie2-reverse/14-et-apres.md
  - "Partie 3 : écrire de l'assembleur":
      - "15. Premiers pas en NASM": partie3-ecriture/15-nasm-syscalls.md
      - "16. Fonctions et libc": partie3-ecriture/16-fonctions-libc.md
      - "17. Shellcode et loader": partie3-ecriture/17-shellcode.md
  - Solutions:
      - "Partie 0": solutions/partie0.md
      - "Partie 1": solutions/partie1.md
      - "Partie 2": solutions/partie2.md
      - "Partie 3": solutions/partie3.md
